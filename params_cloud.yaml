# =============================================================================
# params_cloud.yaml — Cloud-optimized pipeline configuration
#
# Differences from params.yaml:
#   - plot: false  (no GUI, reduces output size)
#   - paths use /app/ container paths
#   - manual_candidate_periods cleared (rely on periodogram only)
# =============================================================================

plot: false
random_seed: 562
manual_candidate_periods: []

# ---- Stage 2: pipeline I/O paths (container-relative) ----
rv_input_dir:    &rv_input_dir    "/app/input/"
lmfit_output_dir: &lmfit_output_dir "/app/output/"
mcmc_output_dir: &mcmc_output_dir  "/app/output/mcmc_out/"

pipeline_io:
  rv_input_dir: *rv_input_dir
  output_dir: *lmfit_output_dir
  object_list: []
  mass_file: ""
  use_fwhm: true

# ---- Periodogram settings ----
periodogram_params:
  min_period: 0.4
  max_period: 10000.0
  ls_norm: "model"
  ls_method: "fast"
  ls_fa_method: "baluev"
  ls_sample_per_peak: 50
  n_bootsraps: 1000
  random_state: 123
  n_sig_periods: 4
  min_period_separation: 1.1
  window_iterations: 10000

# ---- Simulated data parameters ----
simulated_params:
  T0: 0.0
  Period: 250.0
  Eccentricity: 0.3
  OMEGA_rad: 1.0
  K1: 15.0
  K2: 7.0
  GAMMA: 10.0
  number_of_samples: 25
  noise_sigma: 3.0

# ---- lmfit search region ----
lmfit_params:
  possible_minimization_method:
    - leastsq
    - least_squares
    - nelder
    - lbfgsb
    - powell
    - cg
    - newton
    - cobyla
    - bfgs
    - tnc
    - trust-constr
    - slsqp
    - emcee
    - ampgo
    - basinhopping
    - differential_evolution
    - brute
  minimization_method: "differential_evolution"
  search_region:
    Period:       {init_value: 29.7949, min_value: 1.0,    max_value: 45.0,    vary: false}
    GAMMA:        {init_value: 150.0,   min_value: -300.0, max_value: 300.0,   vary: true}
    K1:           {init_value: 200.0,   min_value: 0.0,    max_value: 400.0,   vary: true}
    OMEGA_rad:    {init_value: 3.14,    min_value: 0.0,    max_value: 6.4,     vary: true}
    Eccentricity: {init_value: 0.0,     min_value: 0.0,    max_value: 0.9999,  vary: true}
    T0:           {init_value: 0.0,     min_value: 0.0,    max_value: 0.0,     vary: true}
    ln_sigmaJ:    {init_value: 0.0,     min_value: -2,     max_value: 4.5,     vary: true}

# ---- MCMC posterior sampling ----
mcmc_params:
  __lnsigma: {init_value: 0.1, min_value: 0.001, max_value: 2.0}
  method: "emcee"
  nan_policy: "omit"
  burn: 100
  steps: 2000
  thin: 5
  walkers: 32

  rv_input_dir: *rv_input_dir
  lmfit_input_dir: *lmfit_output_dir
  output_dir: *mcmc_output_dir

  filter_expression: >-
    ~candidate_method.str.contains('MANUAL')
    & ~candidate_method.str.contains('null')
    & (prob_bicc > 0.5)
    & (mass_flag_peri == 0)
    & ((candidate_method.str.contains('LS')
    & (LS_iter_fap < 0.1))
    | (candidate_method.str.contains('PDC')
    & (PDC_iter_fap < 0.1)))
  field_to_check: "bicc"
  take_min: true
