# =============================================================================
# params_bias_cloud.yaml — Google Cloud Batch bias_grid run.
#
# Cloud clone of params_bias_astro3_ed_hoc_rlof_check_ext.yaml: IDENTICAL
# science knobs (preset ed_hoc_rlof_check_ext 16^4 = 65,536 pts,
# pipeline_batched, apply_rlof_gate: false, single variant
# eccentric_only/numerical/lucyT, CvM only, q_min 0.01, adaptive_n_inject,
# log_p_min 0.046, seed 42). Only the deltas needed for containers:
#   - input paths -> /app/data/... (baked into the image by cloud/stage_data.sh
#     + Dockerfile COPY)
#   - output_dir -> /mnt/gcs/output (Batch gcsfuse volume; the run_id lives in
#     the mount's remotePath gs://<bucket>/bias_runs/<run_id>, so this YAML is
#     static across runs)
#   - n_workers: 16 EXPLICIT — never null in a container (os.cpu_count() sees
#     the whole VM through cgroups). Must equal the machine type's vCPUs; the
#     launcher (cloud/run_bias_grid_batch.py) refuses mismatches.
#
# Seeding note: per-point RNG = default_rng(seed + step*137) on the GLOBAL
# step index, so any --grid-start/--grid-end chunking reproduces a single-box
# run bit-identically (same image + CPU arch).
#
# Usage (from the repo root, after ./cloud/stage_data.sh):
#   python -m cloud.run_bias_grid_batch --run-id <id> --build
# =============================================================================

plot: false
plot_style: "paper"
random_seed: 562
fast_detect_backend: numpy
manual_candidate_periods: []

# RV-threshold detection knobs — UNUSED by pipeline_batched (kept for
# provenance/compat with the original fast_batched config).
drv_threshold: 10.0
significance_threshold: 4.0

# ---- I/O paths (container) ----
base_dir:      "/mnt/gcs"
lmfit_subdir:  &lmfit_subdir  "second_pdc"
mcmc_subdir:   &mcmc_subdir   "mcmc_out"

pipeline_io:
  object_list: []
  mass_file: "/app/data/mass_bloem.csv"
  use_fwhm: true

# ---- Bias-grid input parameters ----
bias_grid:
  # paths (staged into the image by cloud/stage_data.sh)
  sb1_tex: "/app/data/tables/sb1_solutions.tex"
  sb2_tex: "/app/data/tables/sb2_solutions.tex"
  mass_file: "/app/data/mass_bloem.csv"
  rv_dir: "/app/data/rv_csvs/"
  sb2_analysis_dir: "/app/data/sb2_per_star"
  ostar_catalog: "/app/data/tables/ostar_catalog.csv"
  output_dir: "/mnt/gcs/output"

  # run shape — full power-law grid (eta >= -1.25), f_bin 0.45..0.85; 16^4 pts.
  preset: ed_hoc_rlof_check_ext
  n_inject: null
  seed: 42
  n_stars_sample: null
  # SINGLE-VARIANT run: eccentric_only e-scoring, numerical logP cutoff,
  # Lucy-Sweeney limits treated as circular; CvM metric only.
  variant_filter:
    e_score_mode: eccentric_only
    logP_cutoff_mode: numerical
    apply_lucy_sweeny_e: true
  scored_tests: [cvm]
  logP_cutoff_smooth_sigma: 0.15   # Gaussian σ (dex) for the numerical cutoff
  logP_cutoff_scope: exclude       # period_only | exclude (fixed across variants)
  detect_method: pipeline_batched
  # Disable the Roche-lobe (mass_flag_peri) cut of pipeline_batched: detection
  # is prob_bicc > 0.5 AND iter_fap < 0.2 only.
  apply_rlof_gate: false

  # ---- Sampling bounds + adaptive injection budget ----
  # log_p_min = observed minimum logP (P=1.11 d) — keeps F_>(π) ≳ 0.1 across
  # the grid (root-cause fix for steep-π drift under scope=exclude).
  log_p_min: 0.046
  log_p_max: 3.5
  # Mass-ratio sampling bounds: q_min 0.01 as in the qmin001/fb099 runs.
  q_min: 0.01
  q_max: 1.0
  # adaptive_n_inject scales n_inject per (π, f_bin) cell so the expected number
  # of injected periods above the cutoff stays ≈ n_above_cutoff_target. Never
  # injects below the preset baseline; capped at n_inject_max. With log_p_min
  # physical this mostly floors to baseline (safety net). false → flat n_inject.
  adaptive_n_inject: true
  n_above_cutoff_target: 2200
  n_inject_max: 50000
  adaptive_n_cutoff: null          # null ⇒ use the run's numerical cutoff

  # parallelism — EXPLICIT in the cloud: one multi-point task per VM, one
  # worker per vCPU. Must match the launcher's --machine-type vCPU count.
  n_workers: 16
  parallel_grid: true

# ---- Periodogram settings (reduced for speed) ----
periodogram_params:
  min_period: 0.4
  max_period: 10000.0
  ls_norm: "model"
  ls_method: "fast"
  ls_fa_method: "baluev"
  ls_sample_per_peak: 50
  n_bootsraps: 50
  random_state: 123
  n_sig_periods: 1
  min_period_separation: 1.1
  pdc_samples_per_peak: 10
  window_iterations: 10
  run_permutations_ls: true
  run_permutations_pdc: true

# ---- lmfit search region ----
lmfit_params:
  minimization_method: "differential_evolution"
  search_region:
    Period:       {init_value: 29.7949, min_value: 1.0,    max_value: 45.0,    vary: false}
    GAMMA:        {init_value: 150.0,   min_value: -300.0, max_value: 300.0,   vary: true}
    K1:           {init_value: 200.0,   min_value: 0.0,    max_value: 400.0,   vary: true}
    OMEGA_rad:    {init_value: 3.14,    min_value: 0.0,    max_value: 6.4,     vary: true}
    Eccentricity: {init_value: 0.0,     min_value: 0.0,    max_value: 0.9999,  vary: true}
    T0:           {init_value: 0.0,     min_value: 0.0,    max_value: 0.0,     vary: true}
    ln_sigmaJ:    {init_value: 0.0,     min_value: -2,     max_value: 4.5,     vary: true}

# ---- MCMC (not used in bias grid, kept for config loading compatibility) ----
mcmc_params:
  __lnsigma: {init_value: 0.1, min_value: 0.001, max_value: 2.0}
  method: "emcee"
  nan_policy: "omit"
  burn: 100
  steps: 2000
  thin: 5
  walkers: 32
  filter_expression: ""
  field_to_check: "bicc"
  take_min: true
