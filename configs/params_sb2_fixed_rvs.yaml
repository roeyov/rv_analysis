# =============================================================================
# params_sb2_fixed_rvs.yaml — SB2 joint-Keplerian batch on zero-point-fixed RVs
#
#   python -m sb2_pipeline.batch --config configs/params_sb2_fixed_rvs.yaml
#   python -m sb2_pipeline.batch --config ... --corrections-only   # stage 0 only
#
# Per star: apply the DR5 per-epoch RV zero-point corrections to rv1/rv2
# (value = rv - rv_correction, err in quadrature), run LS+PDC on |rv1-rv2|
# (analytic FAP only, no permutations), joint 9-parameter lmfit (shared
# P,T0,e,omega,gamma; K1,K2; ln_sigmaJ1/2), eccentric MCMC on the best BICc
# row, Lucy-Sweeney (e_median/sigma_minus > 2.49), circular MCMC fallback.
# Sampler settings mirror params_dr5_fifth_fixed_rvs_mcmc20k.yaml.
# Created 2026-08-12.
# =============================================================================

plot: true
plot_style: "paper"
random_seed: 562
manual_candidate_periods: []

sb2_io:
  sb2_root: "/Users/roeyovadia/Documents/Data/BLOeM_Data/BLOeM_DR5.0_Combined_perStar_sb2"
  provenance_csv: "/Users/roeyovadia/Roey/Masters/Reasearch/Ostars_article/notes/sb2_solution_provenance.csv"
  corrections_csv: "/Users/roeyovadia/Roey/Masters/Reasearch/scriptsOut/CCF/dr5_neb_div_from_coadded/RVcorrectionsDR5.csv"
  output_dir: "/Users/roeyovadia/Roey/Masters/Reasearch/scriptsOut/sb2_fixed_rvs"
  object_list: []                    # empty list = all stars with SB2 RV data
  mjd_match_tolerance: 5.0e-3        # days; same as spectroscopy.apply_rv_corrections
  rv_file_priority: ["rv_final_for_mcmc.csv", "rv_final.csv", "rv_corrected.csv", "rv_extracted.csv"]
  use_fwhm: true

# ---- Periodogram on |rv1 - rv2| (all keys below are bracket-indexed by
#      period_search.candidates.find_periods and must stay present) ----
periodogram_params:
  min_period: 0.4
  max_period: 10000.0
  ls_norm: "model"
  ls_method: "fast"
  ls_fa_method: "baluev"
  ls_sample_per_peak: 50
  n_bootsraps: 1000
  random_state: 123
  n_sig_periods: 4
  min_period_separation: 1.1
  pdc_samples_per_peak: 10
  window_iterations: 10000           # required key even with permutations off
  run_permutations_ls: false         # analytic Baluev FAP only
  run_permutations_pdc: false
  # ESSENTIAL for SB2: |rv1-rv2| of a (near-)circular binary peaks at P/2, so
  # the 2P harmonic candidate is the only route to the true period (verified
  # on BLOeM_1-006: without it every candidate fit contorts to e ~ 0.95).
  include_harmonics: true
  show_permutation_progress: false
  fwhm_window_factor: 1.5

# ---- Joint lmfit search region (Period/T0/GAMMA re-centred per candidate/star) ----
lmfit_params:
  minimization_method: "differential_evolution"
  de_seed: 562
  max_nfev: 200000
  fit_circular_comparison: true
  search_region:
    Period:       {init_value: 5.0,   min_value: 0.4,    max_value: 10000.0, vary: true}
    T0:           {init_value: 0.0,   min_value: 0.0,    max_value: 0.0,     vary: true}
    Eccentricity: {init_value: 0.0,   min_value: 0.0,    max_value: 0.9999,  vary: true}
    OMEGA_rad:    {init_value: 3.14,  min_value: 0.0,    max_value: 6.4,     vary: true}
    GAMMA:        {init_value: 150.0, min_value: -300.0, max_value: 600.0,   vary: true}
    K1:           {init_value: 100.0, min_value: 0.0,    max_value: 500.0,   vary: true}
    K2:           {init_value: 200.0, min_value: 0.0,    max_value: 500.0,   vary: true}
    ln_sigmaJ1:   {init_value: 0.0,   min_value: -2.0,   max_value: 4.5,     vary: true}
    ln_sigmaJ2:   {init_value: 0.0,   min_value: -2.0,   max_value: 4.5,     vary: true}

# ---- MCMC posterior sampling (mirrors the SB1 mcmc20k adoption run) ----
mcmc_params:
  burn: 2000
  steps: 20000
  thin: 5
  walkers: 32
  dP_frac: 0.01
  sigma_P_frac: 0.002
  prune_stuck_walkers: true

  # SB2/paper convention (RUIGUI2): e_median / (p50 - p16) > 2.49.
  lucy_sweeney_threshold: 2.49
  lucy_sweeney_estimator: "median"   # "median" (SB2 convention) or "mode" (SB1 batch)

  # No *_iter_fap clauses (permutations off -> NaN) and no mass_flag_peri
  # (no RLOF machinery in the SB2 pipeline).
  filter_expression: >-
    ~candidate_method.str.contains('MANUAL')
    & ~candidate_method.str.contains('null')
    & candidate_method.str.contains('jitter')
    & (prob_bicc > 0.5)
  field_to_check: "bicc"
  take_min: true
